name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # windows-2022 ships the .NET Framework 4.8 targeting pack
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild NoSave.sln -p:Configuration=Release -v:minimal -nologo

      - name: SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash NoSave/bin/Release/NoSave.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NoSave.exe" | Out-File -Encoding ascii NoSave/bin/Release/NoSave.exe.sha256
          "SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: NoSave
          path: |
            NoSave/bin/Release/NoSave.exe
            NoSave/bin/Release/NoSave.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NoSave

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" NoSave.exe NoSave.exe.sha256
          --repo "$GITHUB_REPOSITORY"
          --title "NoSave $GITHUB_REF_NAME"
          --notes "Built by GitHub Actions from commit $GITHUB_SHA. SHA-256: $(cut -d' ' -f1 NoSave.exe.sha256)"
